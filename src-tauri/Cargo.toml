[package]
name = "composer"
version = "0.2.0"
description = "Composer - 模块化提示词构建工具"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "composer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-http = "2"
enigo = "0.6"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
# Antigravity 的会话落在 SQLite 里（E9）。`bundled` 自带 SQLite 源码编译，
# 不依赖系统库——CI 的 macOS/Windows 编译检查不会因为找不到 libsqlite3 而挂。
# 代价是首次编译要跑一遍 C 编译。
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSRunningApplication", "NSWorkspace", "NSApplication", "libc"] }
objc2-foundation = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
