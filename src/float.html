<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Composer 浮窗</title>
<!-- 主题 bootstrap：与主窗口 index.html 共用同一份 theme-boot.js（原来这里各自内联
     一份完全相同的代码）。非 module 的普通 <script src> 仍是同步阻塞执行，放在样式
     表 <link> 之前就能在 CSS 生效前完成，效果与内联等价，不会闪一下默认主题；外置
     出去是为了让 CSP 的 script-src 不需要 'unsafe-inline'。 -->
<script src="theme-boot.js"></script>
<!-- 本地字体：与主窗口同源同文件，浮窗字体来源终于和主窗口一致了（以前只有
     index.html 挂了 Google Fonts 的 <link>，float.html 从未加载过，@font-face 是
     按文档生效的，浮窗一直用 Segoe UI 系统字体兜底）。详见 src/fonts.css。 -->
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="float.css" />
</head>
<body>

  <div class="fw-card" id="fwCard" style="position:relative;">
    <button class="fw-mini-orb" id="fwMiniOrb" type="button" title="展开浮窗（可拖动）" aria-label="展开浮窗">
      <span class="fw-mini-orb-label">C</span>
    </button>
    <div class="fw-drag" data-tauri-drag-region>
      <span class="fw-title" data-tauri-drag-region>COMPOSER</span>
      <div class="fw-drag-actions">
        <button class="fw-min" id="fwMinBtn" type="button" title="缩小为图标" aria-label="缩小为图标">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <button class="fw-close" id="fwCloseBtn" type="button" title="隐藏浮窗" aria-label="隐藏浮窗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- tab 栏：编写 / Agent。放在 .fw-drag 与 .fw-body 之间，两个 panel 平级包在
         .fw-body 内部，切换只靠 float.js 切 is-active 类，不拆 DOM、不重新挂节点，
         省得每次切 tab 都要重新 bindEvent。Agent 按钮上挂角标：有几个 agent 在等
         你回话，为 0 时 fleetView 会给它加 hidden。 -->
    <div class="fw-tabs" id="fwTabs" role="tablist">
      <button class="fw-tab-btn is-active" id="fwTabComposeBtn" type="button" role="tab" aria-selected="true">编写</button>
      <button class="fw-tab-btn" id="fwTabFleetBtn" type="button" role="tab" aria-selected="false">
        Agent
        <span class="fw-tab-badge" id="fwTabFleetBadge" hidden></span>
      </button>
    </div>

    <div class="fw-body">
      <div class="fw-panel is-active" id="fwPanelCompose">
        <div class="fw-editor-wrap">
          <div class="fw-editor-toolbar">
            <div class="fw-toolbar-left">
              <span class="fw-editor-label" id="fwEditorLabel">正文</span>
              <label class="fw-autopaste" id="fwAutoPasteLabel" title="开启后，点击下方“常用句/插入模块”会在复制后自动粘贴到刚才聚焦的外部窗口">
                <input type="checkbox" id="fwAutoPasteToggle" />
                <span class="fw-autopaste-slider"></span>
                <span class="fw-autopaste-text">点击即粘贴</span>
              </label>
            </div>
            <div class="fw-toolbar-right">
              <button class="fw-clear-btn" id="fwClearBtn" type="button" title="清空正文" aria-label="清空正文">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
                清空
              </button>
              <button class="fw-copy-btn" id="fwCopyBtn" type="button" title="复制编辑器内容">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                复制
              </button>
            </div>
          </div>
          <div class="fw-hl-wrap">
            <div class="fw-hl-overlay" id="fwHlOverlay" aria-hidden="true"></div>
            <textarea class="fw-textarea" id="fwTextarea" placeholder="正文内容…" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="fw-lists">
          <div>
            <div class="fw-section-title">插入模块</div>
            <div class="fw-pill-wrap" id="fwModuleWrap"></div>
          </div>
          <div>
            <div class="fw-section-title">常用句</div>
            <div class="fw-pill-wrap" id="fwSnippetWrap"></div>
          </div>
          <div>
            <div class="fw-section-title">快速段落</div>
            <div class="fw-quick-wrap" id="fwQuickWrap"></div>
          </div>
        </div>
      </div>

      <div class="fw-panel" id="fwPanelFleet"></div>
    </div>

    <div class="fw-toast" id="fwToast" role="status" aria-live="polite"></div>
  </div>

<script type="module" src="float.js"></script>
</body>
</html>
